[package]
name = "mercs2_workshop"
version = "4.0.0"
edition = "2021"
description = "Mercenaries 2 modernization — native asset workshop (browse / inspect / remix) on the mercs2_engine renderer."
readme = "README.md"
license.workspace = true
repository.workspace = true

[dependencies]
winit = "0.29"
wgpu = "0.20"
pollster = "0.3"
glam = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17" # --tex-png headless dump (CPU BC1/BC3 decode -> PNG for visual inspection)
# glTF import (drag-drop a .gltf/.glb onto the workshop window -> engine-rendered preview).
# `import` decodes buffers + images (PNG/JPEG) so materials come across without extra plumbing.
# KHR_materials_specular: community rips exported from Blender/Substance routinely carry their
# specular there instead of in metallicRoughness; without the feature those maps are invisible to us.
gltf = { version = "1", features = ["KHR_materials_specular"] }
# The inspector GUI (Unreal-style Details panel, mouse-driven): egui painted through the engine's
# Scene overlay hook. egui 0.28 matches wgpu 0.20; the winit-0.29 event bridge is hand-rolled in
# gui.rs (egui-winit 0.28 wants winit 0.30, which the engine is not on yet).
egui = "0.28"
egui-wgpu = "0.28"
# OS clipboard for the context menus' copy actions — our hand-rolled bridge must handle egui's
# PlatformOutput.copied_text itself (egui-winit would normally do this).
arboard = "3"
# Native file-open dialog for the "Import model…" button (same import path as drag-drop).
rfd = "0.14"
# Self-service reference data: fetch the release's workshop_data bundle when none is installed, so a
# bare downloaded binary is not stuck showing bare 0x… hashes for every bone. `ureq` (blocking,
# rustls) rather than reqwest — a winit event loop wants no async runtime, and rustls keeps the
# Linux build off a system OpenSSL. `zip` reads the published asset; flate2 is already in the tree.
ureq = "2"
# The game's audio decoders (IMA ADPCM → PCM16) and cpal output, for playing VO straight from the
# game's own vo_stream.english.pws — no download, no re-encode.
mercs2_audio = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }
# Offscreen `--shot` renderer: POD vertex/buffer casts.
bytemuck = { version = "1", features = ["derive"] }
# The Missions Blueprint's Lua model: a lossless Lua AST (every token keeps its trivia), so a
# script printed back from it is byte-for-byte the source it was parsed from — see
# docs/modernization/workshop_charter.md §Mission designer. `lua52` for `goto`/`::label::`: unluac
# emits them for control flow it cannot structure in the debug-stripped DLC chunks
# (docs/mercs2-dlc-luacd/README.md). What retail accepts is decided by the mercs2_luac compile.
full_moon = { version = "3", default-features = false, features = ["lua52"] }
# The Blueprint's Compile: the workspace's one Lua 5.1.5 (the game's float VM), so a script that
# compiles here is bytecode the game loads.
mercs2_luac = { workspace = true }
mercs2_engine = { workspace = true }
mercs2_core = { workspace = true }
mercs2_formats = { workspace = true }
# The Shipment format, linter and builder — the Quartermaster dock is its UI front end.
mercs2_quartermaster = { workspace = true }
mercs2_bridge = { workspace = true }
mercs2_destruction = { workspace = true }
# Saves page Delete: moves a .profile to the OS trash (recoverable) rather than removing it.
trash = "5"

[features]
# Builds the game-gated tests, which read the retail vz.wad named by the repo-root
# .mercs2-local.toml; run them with `cargo xtask retail-test`.
retail = []

[[test]]
name = "anim_export_parity"
required-features = ["retail"]

[[test]]
name = "outfit_render"
required-features = ["retail"]
