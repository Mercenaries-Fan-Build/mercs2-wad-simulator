[package]
name = "mercs2_script"
version = "2.0.1"
edition = "2021"
description = "The engine's Lua script host: VM + module system (import/inherit) + the Sys.*/engine binding mechanism. Asset-agnostic; the game's Mercenaries Lua runs ON it. Runs the game's OWN Lua 5.1.5 VM (float lua_Number), so the shipped corpus executes as authored."
readme = "README.md"
license.workspace = true
repository.workspace = true

[lib]
name = "mercs2_script"
path = "src/lib.rs"

[dependencies]
# THE game's Lua — 5.1.5 with Pandemic's three patches, vendored by `mercs2_luac` and shared with the
# bytecode compiler. One Lua in the workspace, deliberately: two builds export the same unprefixed
# `lua_*` symbols and put one implementation's `lua_State` through the other's functions, which is a
# SIGSEGV rather than a link error.
#
# It replaced `mlua` (5.4) rather than wrapping it, for two reasons that are not preferences:
#   * `mlua-sys` hardcodes `lua_Number = c_double`; this VM is built `LUA_NUMBER float`, so mlua
#     would push 8 bytes everywhere the VM reads 4.
#   * 5.4 cannot run the shipped corpus. `resident/mrxtaskjob{destroy,verify}set.lua` use the
#     implicit vararg `arg` table, which is a hidden local the 5.1 VM materialises per call and no
#     Lua-level shim can synthesise. On 5.4 those scripts throw when executed.
# The 5.1→5.4 compat prelude that used to live in `lib.rs` is gone with it: `unpack`, `table.getn`,
# `getfenv`/`setfenv` and friends are all native here.
mercs2_luac = { workspace = true }
# The HUD widget tree + marker set the `Hud.*`/`Gui.*` bindings drive (via the EngineHost seam).
mercs2_ui = { workspace = true }
# The player roster + profile singleton the 107 `Player.*` bindings drive (same seam shape as
# mercs2_ui above: EngineHost hands out `Option<&mut PlayerWorld>` and the bodies call it directly).
mercs2_player = { workspace = true }
# The render/post-FX parameter state (RenderState) the `Atmosphere`/`Bloom`/`Graphics`/`Fade` drive,
# and the ObjectFilter/render-state types the EngineHost seam names.
mercs2_core = { workspace = true }
# The engine name hash (`pandemic_hash_m2`) that `String.GetHash` funnels into — one implementation,
# shared with the asset/bone/template name paths rather than duplicated here.
mercs2_formats = { workspace = true }

[dev-dependencies]
# The game-hook harness backs its EngineHost with the real AI mechanism so the Ai.* hooks exercise
# the recovered action ring + relation matrix (not a stand-in). Test-only — the lib stays standalone.
mercs2_ai = { workspace = true }
