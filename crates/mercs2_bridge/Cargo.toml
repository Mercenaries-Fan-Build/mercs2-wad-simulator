[package]
name = "mercs2_bridge"
version = "0.1.0"
edition = "2021"
description = "Live link to a running Mercenaries 2 via Wally's lua-bridge ASI: a rate-limited raw-TCP client for its <<<RUN>>>/<<<END>>> REPL protocol, consumed by the Workshop and Modkit."
license.workspace = true
repository.workspace = true

[lib]
name = "mercs2_bridge"
path = "src/lib.rs"

# std-only on purpose: the transport is a loopback TCP socket, and a networking crate would be weight
# for nothing. The perf discipline (rate-limit, poll-not-block, off the game's critical path) is a
# property of THIS crate, not the caller.
[dependencies]
