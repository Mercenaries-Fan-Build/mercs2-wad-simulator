[package]
name = "mercs2_probe"
version = "4.0.0"
edition = "2021"
description = "Mercenaries 2 modernization — headless WAD diagnostic/export tool. Runs the carved-out diagnostics from mercs2_engine::diag as subcommands (no window)."
readme = "README.md"
license.workspace = true
repository.workspace = true

[[bin]]
name = "mercs2_probe"
path = "src/main.rs"

[dependencies]
png = "0.17" # decode the source glTF's embedded PNG atlases for tex_build
# `lua_chunk_scan` inflates console (`segs`, big-endian) WAD blocks itself — the format crate's
# `decompress_sges` is LE-only and silently returns raw bytes for a console block.
flate2 = "1"
# The diagnostics + shared world helpers live in the engine library.
mercs2_engine = { workspace = true }
mercs2_formats = { workspace = true }
# `ess-menu-check` runs Ess and a menu script on the game's exact Lua 5.1 (float lua_Number).
mercs2_luac = { workspace = true }
# `ess-live` drives the running game through lua-bridge's REPL.
mercs2_bridge = { workspace = true }
# `overlays` reuses the streaming catalog fold (StreamingManager) to count what each vz_state overlay adds.
mercs2_core = { workspace = true }
# `model_namer` emits a rainbow-table name fragment (same JSON shape the workshop merges).
serde_json = "1"
# segm_collision_census serializes its per-model census to JSON via derive.
serde = { version = "1", features = ["derive"] }
# `mopp_swap` verifies its patched PHY2 artifacts BY sha256 (mandate: verify-artifacts-by-hash).
sha2 = "0.10"
# `prof-samples` finds the code image of a profiled exe (catalogue, images, canonical tree) and reads its
# Ghidra functions export. `dump-*` refuses a capture whose exe is not a catalogued v1.0 build (the
# decomp's addresses).
mercs2_exemap = { workspace = true }
# `dump-*` reads the retail game's memory out of the x32dbg captures in game-files/memory-dumps.
minidump = "0.27"

[features]
# Builds the game-gated tests, which read the retail vz.wad named by the repo-root .mercs2-local.toml;
# run them with `cargo xtask retail-test`.
retail = []

[[test]]
name = "audio_wad_probe"
required-features = ["retail"]

[[test]]
name = "hardpoint_probe"
required-features = ["retail"]

[[test]]
name = "spawn_marker_probe"
required-features = ["retail"]

[[test]]
name = "watermap_wad_probe"
required-features = ["retail"]
