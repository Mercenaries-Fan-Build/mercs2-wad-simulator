[package]
name = "mercs2_luac"
version = "1.1.1"
edition = "2021"
description = "Mercenaries 2 Lua 5.1.5 — the workspace's single Lua. Vendors the game's VM flavour (float lua_Number, 32-bit size_t), emits LuaQ chunks the game accepts from any host, and exposes the whole VM as raw FFI (`sys`) so the engine's script host and the bytecode compiler share one library instead of colliding over unprefixed `lua_*` symbols."
license.workspace = true
repository.workspace = true

[lib]
name = "mercs2_luac"
path = "src/lib.rs"

[build-dependencies]
cc = "1"

[dev-dependencies]
# `tests/parity.rs` diffs our output against the bytecode retail actually shipped, which means
# reading `scripts_vz` out of a WAD.
#
# Historically this could NOT be `mercs2_script` — that crate linked mlua's vendored Lua 5.4 while
# this one vendors Lua 5.1, both exporting the same unprefixed C symbols (`lua_newstate`,
# `lua_pcall`, …), and linking both put one implementation's `lua_State` through the other's
# functions: an immediate SIGSEGV, not a link error.
#
# `mercs2_script` now runs THIS crate's VM, so the hazard is gone. The corpus is still reached by
# path, which keeps this compiler test buildable without the engine's binding surface.
mercs2_formats = { workspace = true }
