[package]
name = "mercs2_luac"
version = "1.0.1"
edition = "2021"
description = "Mercenaries 2 Lua 5.1 bytecode compiler — emits LuaQ chunks the game's VM accepts (float lua_Number, 32-bit size_t), from any host."
license.workspace = true
repository.workspace = true

[lib]
name = "mercs2_luac"
path = "src/lib.rs"

[build-dependencies]
cc = "1"

[dev-dependencies]
# `tests/parity.rs` diffs our output against the bytecode retail actually shipped, which means
# reading `scripts_vz` out of a WAD.
#
# ⚠ Deliberately NOT `mercs2_script`, even though it owns the Lua corpus this test reads. That crate
# links mlua's vendored Lua 5.4, and our vendored Lua 5.1 exports the same unprefixed C symbols
# (`lua_newstate`, `lua_pcall`, …). Linking both puts one implementation's `lua_State` through the
# other's functions — an immediate SIGSEGV, not a link error. The corpus is reached by path instead.
mercs2_formats = { workspace = true }
