[package]
name = "dlc_port"
version = "0.1.1"
edition = "2021"
description = "Converts a console Mercenaries 2 DLC package (PS3 .pkg, Xbox 360 STFS/DOH) into PC-form level components. Its library is what qm's fetch_package kind runs on the player's machine."
license.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
name = "dlc_port"
path = "src/lib.rs"

[[bin]]
name = "dlc_port"
path = "src/main.rs"

[dependencies]
mercs2_formats = { workspace = true }
ucfx_byteswap = { workspace = true }
clap = { version = "4", features = ["derive"] }
