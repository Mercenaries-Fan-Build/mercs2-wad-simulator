[package]
name = "mercs2_quartermaster"
version = "1.0.0"
edition = "2021"
description = "Mercenaries 2 Shipment format: reads a manifest.yaml/.json/.toml, lints it against the engine's HANG-class traps, and builds it into an overlay WAD. Ships the `qm` CLI."
license.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
name = "mercs2_quartermaster"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# YAML: `serde_yaml` is ARCHIVED. `serde_yml` is DEPRECATED (its own crates.io blurb calls it an
# unmaintained compatibility shim). `serde_norway` is the maintained fork of serde-yaml.
serde_norway = "0.9"
serde_json = "1"
toml = "1"
mercs2_formats = { workspace = true }
# Artifacts are verified BY HASH (mandate verify-artifacts-by-hash-not-size-mtime), so sha256 is
# load-bearing rather than incidental. `mercs2_workshop` hand-rolls one, but it is a binary-only
# crate so that copy is unreachable — and hand-rolling a hash twice in one workspace is worse than
# a dependency.
sha2 = "0.10"
# The Lua linker compiles the base script plus each Shipment's appended source into one scripts_vz
# block. Verified against retail bytecode by `mercs2_luac/tests/parity.rs`.
#
# ⚠ This crate must NEVER also depend on `mercs2_script`. That crate links mlua's vendored Lua 5.4
# while this compiler vendors a patched Lua 5.1, and both export the same unprefixed C symbols
# (`lua_newstate`, `lua_pcall`, …). Linking both is a runtime SIGSEGV, not a link error. The Lua
# corpus is therefore taken as a PATH, not by depending on the crate that owns it.
mercs2_luac = { workspace = true }
png = "0.17"  # decode source images for texture lowering (same version the workspace already uses)
# M0003's predicate. `texture::texture_buffer_too_small` carries two retail-verified false-positive
# gates — without them the rule fires on the 9,562 streamed bodies retail legitimately ships short —
# so this is a dependency rather than a second copy. `wad_simulator` links no Lua runtime, so it does
# not reintroduce the mlua/`mercs2_luac` symbol collision warned about above.
wad_simulator = { workspace = true }
clap = { version = "4", features = ["derive"] }

[[bin]]
name = "qm"
path = "src/bin/qm.rs"
