[package]
name = "mercs2_quartermaster"
version = "0.1.0"
edition = "2021"
description = "Mercenaries 2 Shipment format: one serde model that reads a manifest.yaml/.json/.toml, validates it, and (later) lints and builds it into an overlay WAD."
license.workspace = true
repository.workspace = true

[lib]
name = "mercs2_quartermaster"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# YAML: `serde_yaml` is ARCHIVED. `serde_yml` is DEPRECATED (its own crates.io blurb calls it an
# unmaintained compatibility shim). `serde_norway` is the maintained fork of serde-yaml.
serde_norway = "0.9"
serde_json = "1"
toml = "1"
mercs2_formats = { workspace = true }
# Artifacts are verified BY HASH (mandate verify-artifacts-by-hash-not-size-mtime), so sha256 is
# load-bearing rather than incidental. `mercs2_workshop` hand-rolls one, but it is a binary-only
# crate so that copy is unreachable — and hand-rolling a hash twice in one workspace is worse than
# a dependency.
sha2 = "0.10"
png = "0.17"  # decode source images for texture lowering (same version the workspace already uses)
