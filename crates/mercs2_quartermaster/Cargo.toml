[package]
name = "mercs2_quartermaster"
version = "2.3.0"
edition = "2021"
description = "Mercenaries 2 Shipment format: reads a manifest.yaml/.json/.toml, lints it against the engine's HANG-class traps, and builds it into an overlay WAD. Ships the `qm` CLI."
license.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
name = "mercs2_quartermaster"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# YAML: `serde_yaml` is ARCHIVED. `serde_yml` is DEPRECATED (its own crates.io blurb calls it an
# unmaintained compatibility shim). `serde_norway` is the maintained fork of serde-yaml.
serde_norway = "0.9"
serde_json = "1"
toml = "1"
mercs2_formats = { workspace = true }
# Artifacts are verified BY HASH (mandate verify-artifacts-by-hash-not-size-mtime), so sha256 is
# load-bearing rather than incidental. `mercs2_workshop` hand-rolls one, but it is a binary-only
# crate so that copy is unreachable — and hand-rolling a hash twice in one workspace is worse than
# a dependency.
sha2 = "0.10"
# The Lua linker compiles the base script plus each Shipment's appended source into one scripts_vz
# block. Verified against retail bytecode by `mercs2_luac/tests/parity.rs`.
#
# This used to carry a hard prohibition on ever depending on `mercs2_script`: that crate linked
# mlua's vendored Lua 5.4 while this compiler vendors a patched Lua 5.1, both exporting the same
# unprefixed C symbols, and linking both was a runtime SIGSEGV rather than a link error.
#
# `mercs2_script` now runs `mercs2_luac`'s VM — one Lua in the workspace — so that prohibition is
# lifted, and it is what lets the Workshop link this crate at all. The Lua corpus is still taken as a
# PATH rather than by dependency, to keep this crate headless.
# Guard: `mercs2_engine/tests/one_lua.rs` links the runtime and the compiler together on purpose.
mercs2_luac = { workspace = true }
png = "0.17"  # decode source images for texture lowering (same version the workspace already uses)
# M0003's predicate. `texture::texture_buffer_too_small` carries two retail-verified false-positive
# gates — without them the rule fires on the 9,562 streamed bodies retail legitimately ships short —
# so this is a dependency rather than a second copy. `wad_simulator` links no Lua runtime, so it does
# not reintroduce the mlua/`mercs2_luac` symbol collision warned about above.
wad_simulator = { workspace = true }
clap = { version = "4", features = ["derive"] }
# Managed dependencies (`load.requires` → `Requirement::Compatible`) carry a semver RANGE, resolved
# like a package manager. The same crate Cargo itself parses version requirements with, so the range
# semantics a modder expects (`^0.1`, `>=0.0.3, <1.0.0`) are exactly what they get.
semver = "1"

[dev-dependencies]
# Only to BUILD a compressed `CFX` movie fixture. The `add_movie` lowering must accept one and ship
# it back unchanged — retail carries 61 CFX movies against 3 uncompressed GFX — and asserting that
# needs a real zlib stream, not a plausible-looking one. Nothing in `src/` compresses a movie; that
# is the whole point of the test.
flate2 = "1"

[[bin]]
name = "qm"
path = "src/bin/qm.rs"
