[package]
name = "mercs2_formats"
version = "3.0.0"
edition = "2021"
description = "Mercenaries 2 modernization — asset format layer: WAD/sges/UCFX/mesh/texture/terrain container parsing and decompression."
readme = "README.md"
license.workspace = true
repository.workspace = true

[dependencies]
flate2 = "1"
# Parser + accessor readers ONLY. `default-features` pulls `import`, which drags in `image` and
# `base64` for decoding embedded textures — this crate never needs those: a Shipment supplies its
# maps as separate files, and the rigid-prop path reads geometry alone.
gltf = { version = "1", default-features = false, features = ["utils"] }

[dev-dependencies]
serde_json = "1"
