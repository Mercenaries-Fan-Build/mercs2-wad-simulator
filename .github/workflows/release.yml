name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux pinned to ubuntu-22.04 (glibc 2.35) to match the modkit's build
          # floor — the modkit downloads and runs these binaries, so a newer image
          # would raise the glibc requirement above what the modkit supports.
          # PUBLISHED SET (curated — the workspace builds ~78 binaries, but the rest are one-off
          # research probes that stay development-only). `bin:asset` renames on publish: the
          # mercs2_smuggler crate's bin TARGET is called `smuggler`, which would ship as an asset
          # nobody recognises.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            suffix: "-linux-x86_64"
            build: "--workspace"
            bins: "wad_simulator ucfx_byteswap loadprobe smuggler:mercs2_smuggler securom_unwrap wad_builder model_forge inject_parts inject_static mercs2_game mercs2_workshop qm"
          # 32-bit builds the ENGINE-FREE tools only: mercs2_engine — and mercs2_game/workshop with
          # it — is 64-bit by design, and its gilrs/cpal deps link C system libs (libudev, alsa)
          # that would need a full i386 multiarch sysroot to cross-build. The six crates below are
          # engine-free and link no C libs, so they cross-compile clean.
          #
          # `qm` is deliberately NOT here. It is authoring tooling — it reads a Shipment and writes a
          # WAD — and never runs inside the game's 32-bit process, so it has no reason to match the
          # game's bitness the way an injected tool would. Adding it would also mean cross-compiling
          # mercs2_luac's vendored C Lua for i686, which nothing has exercised. Add it if a 32-bit
          # consumer ever appears; the omission is a decision, not an oversight.
          - os: ubuntu-22.04
            target: i686-unknown-linux-gnu
            suffix: "-linux-i686"
            build: "-p wad_simulator -p ucfx_byteswap -p loadprobe -p mercs2_smuggler -p securom_unwrap -p wad_builder -p mercs2_formats"
            bins: "wad_simulator ucfx_byteswap loadprobe smuggler:mercs2_smuggler securom_unwrap wad_builder model_forge inject_parts inject_static"
          # Linux on ARM, on a native arm64 runner at the same 22.04 glibc floor. Full workspace,
          # like the other 64-bit rows: the engine's C deps are the same libudev/alsa packages the
          # x86_64 row installs, and apt has them for arm64 — nothing here needs a sysroot, which is
          # what kept the i686 rows engine-free.
          #
          # The modkit maps this host (`commands/toolchain.rs::platform_suffix` -> `-linux-arm64`)
          # and publishes a linux-aarch64 AppImage, but nothing built the assets — so every tool on
          # its Workshop page reported "no build for this machine". That file's own comment named
          # this exact failure: "a suffix with no publisher makes every tool report 'no build for
          # this machine'".
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: "-linux-arm64"
            build: "--workspace"
            bins: "wad_simulator ucfx_byteswap loadprobe smuggler:mercs2_smuggler securom_unwrap wad_builder model_forge inject_parts inject_static mercs2_game mercs2_workshop qm"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: "-windows-x86_64.exe"
            build: "--workspace"
            bins: "wad_simulator ucfx_byteswap loadprobe smuggler:mercs2_smuggler securom_unwrap wad_builder model_forge inject_parts inject_static mercs2_game mercs2_workshop qm"
          - os: windows-latest
            target: i686-pc-windows-msvc
            suffix: "-windows-i686.exe"
            build: "-p wad_simulator -p ucfx_byteswap -p loadprobe -p mercs2_smuggler -p securom_unwrap -p wad_builder -p mercs2_formats"
            bins: "wad_simulator ucfx_byteswap loadprobe smuggler:mercs2_smuggler securom_unwrap wad_builder model_forge inject_parts inject_static"
          # Windows on ARM, on a native arm64 runner — the counterpart to the linux-arm64 row, and
          # the last host the modkit ships an installer for that published no tools. Full workspace:
          # the engine's two C deps are Windows APIs here (gilrs -> XInput, cpal -> WASAPI), both of
          # which ARM64 Windows provides. Native runner rather than cross-compiling so MSVC targets
          # ARM64 directly — which also covers mercs2_luac's vendored C Lua, the one piece of this
          # workspace that goes through `cc` and has never been built for this triple.
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            suffix: "-windows-arm64.exe"
            build: "--workspace"
            bins: "wad_simulator ucfx_byteswap loadprobe smuggler:mercs2_smuggler securom_unwrap wad_builder model_forge inject_parts inject_static mercs2_game mercs2_workshop qm"
          # macOS builds the FULL workspace, like the other 64-bit rows. The two C-library deps that
          # forced the i686 rows to stay engine-free resolve to system frameworks here — gilrs uses
          # IOKit and cpal uses CoreAudio — so there is nothing to install and no sysroot to assemble.
          # (`winreg` is the only OS-gated dep in the workspace and is already `cfg(windows)`.)
          #
          # BOTH arches build on the arm64 runner: aarch64 natively, x86_64 as a cross-target the
          # Apple toolchain links without an extra sysroot. Intel-native runners (macos-13) are being
          # retired, so cross-compiling is the durable way to keep publishing the x86_64 asset —
          # which the modkit asks for BY EXACT NAME (`wad_simulator-macos-x86_64`, no fallback), and
          # which no job built until now, so every macOS modkit install failed at the fetch.
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: "-macos-arm64"
            build: "--workspace"
            bins: "wad_simulator ucfx_byteswap loadprobe smuggler:mercs2_smuggler securom_unwrap wad_builder model_forge inject_parts inject_static mercs2_game mercs2_workshop qm"
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: "-macos-x86_64"
            build: "--workspace"
            bins: "wad_simulator ucfx_byteswap loadprobe smuggler:mercs2_smuggler securom_unwrap wad_builder model_forge inject_parts inject_static mercs2_game mercs2_workshop qm"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install 32-bit Linux toolchain
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib

      # mercs2_engine links two C system libraries on Linux: gilrs -> libudev-sys
      # (gamepad hotplug via evdev) and cpal -> alsa-sys (audio output). Both
      # 64-bit Linux rows build the engine, so both need them; the i686 row does
      # not, which is exactly why it stays engine-free.
      - name: Install engine system libraries
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev libasound2-dev

      # `--message-format=json` makes cargo report the path of every executable it produced, which is
      # the only honest answer to "what did this build actually make". We publish a CURATED subset
      # (the workspace builds ~78 binaries, but most are one-off research probes that stay dev-only),
      # and the two guardrails below exist because the previous hand-written list rotted silently:
      # it named 8 binaries while 70 others — mercs2_smuggler, inject_parts, the aset_* naming
      # pipeline, vo_extract, … — were compiled every release and then thrown away, unnoticed.
      - name: Build binaries
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} ${{ matrix.build }} \
            --message-format=json > cargo-build.json
          # `--message-format=json` swallows human-readable diagnostics; put them back in the log.
          grep -o '"rendered":"[^"]*"' cargo-build.json | sed 's/"rendered":"//; s/"$//' | head -50 || true
          # Every executable this build produced (JSON-escapes \\ on Windows paths).
          grep -o '"executable":"[^"]*"' cargo-build.json \
            | sed 's/"executable":"//; s/"$//; s#\\\\#/#g' | sort -u > built.txt
          echo "built $(wc -l < built.txt) executables"

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p dist
          published=""
          for entry in ${{ matrix.bins }}; do
            # `bin` or `bin:published_asset_name`
            bin="${entry%%:*}"
            asset="${entry##*:}"
            src=$(grep -iE "/${bin}(\.exe)?$" built.txt | head -1)
            # GUARDRAIL 1: a curated name that no longer builds is an ERROR, not a silent skip.
            if [ -z "$src" ] || [ ! -f "$src" ]; then
              echo "::error::'$bin' is in the publish list but was not built for ${{ matrix.target }}"
              exit 1
            fi
            cp "$src" "dist/${asset}${{ matrix.suffix }}"
            published="$published $bin"
          done
          echo "published $(ls dist | wc -l) binaries:"; ls dist | sed 's/^/  /'
          # GUARDRAIL 2: surface what was built but NOT shipped, so a new tool cannot go unnoticed
          # the way 70 of them did. Informational — dev-only probes are expected here.
          echo "built but NOT published (dev-only tooling):"
          while read -r exe; do
            n=$(basename "$exe"); n="${n%.exe}"
            case " $published " in *" $n "*) ;; *) echo "  - $n";; esac
          done < built.txt

      # The workshop's reference bundle (workshop_charter.md, "Reference bundle" mandate): everything
      # the tool consults that is NOT a game-distributed file. Its centrepiece is `names.bin`, the
      # hash -> name pack — and BONE names live only there. The binary embeds `aset_names.tsv`, which
      # is the ASSET namespace and covers just 1,084 of the 10,199 bone hashes that actually appear in
      # HIER; the pack covers 5,309. So without this step every released workshop drew its skeletons
      # and exported its glTF nodes as `bone0`, `bone1`, … and name-based retarget had nothing to
      # match on. Built ONCE (the pack is OS-independent) from the committed
      # `data/production_names.json`, which needs neither the parent-repo rainbow table nor a game
      # install — that self-containment is the whole reason the pack can be built on a CI runner.
      # The bundle's OTHER four sources live in the research repo, not this one: the registry rows,
      # the spawnable templates, the 220-class ECS schemas and the two decompiled-Lua corpora. They
      # are ~11 MB across 431 files, and copying them in here would duplicate data that is actively
      # maintained over there — so CI reads them at their source instead. Both repos are public, so
      # the default GITHUB_TOKEN suffices; sparse + blobless + depth-1 pulls only these five paths
      # out of an 81 MB repo. Without this the release bundle is names.bin and nothing else, and
      # every insight feature that reads a corpus (COMP inspector, Lua references, blueprint lifter)
      # is dead in a downloaded workshop.
      - name: Check out the reference corpora (once)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/checkout@v4
        with:
          repository: Mercenaries-Fan-Build/notes-on-the-released-game
          path: _refdata
          sparse-checkout: |
            docs/data/live_registry_hashes.csv
            docs/data/spawnable_templates.csv
            docs/mercs2-ecs
            docs/mercs2-luacd/src
            docs/mercs2-dlc-luacd/src
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Build workshop_data reference bundle (once)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          # Run from _refdata so `pack_data`'s repo walk-up finds the corpora at `docs/…`. It also
          # walks up from the EXE, which still reaches this workspace's `data/production_names.json`
          # — so the names come from here and the corpora from there, with no new flags.
          out="$GITHUB_WORKSPACE/workshop_data"
          cd _refdata
          "$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/mercs2_workshop" --pack-data "$out"
          cd "$GITHUB_WORKSPACE"
          # GUARDRAIL 1: a pack that built but resolved almost nothing is the exact silent failure
          # this step exists to end — fail loudly rather than ship another nameless-bone release.
          n=$(sed -n 's/.*"names": \([0-9]*\).*/\1/p' workshop_data/manifest.json)
          echo "names.bin: ${n:-0} names"
          if [ "${n:-0}" -lt 20000 ]; then
            echo "::error::workshop_data/names.bin has only ${n:-0} names (expected >= 20000) — bone names would be missing"
            exit 1
          fi
          # GUARDRAIL 2: every content the manifest PROMISES must actually be in the bundle. The
          # corpora resolve by walk-up, so a moved path degrades to a warning inside --pack-data and
          # would otherwise ship a bundle quietly missing whole features.
          missing=""
          for c in names.bin live_registry_hashes.csv spawnable_templates.csv ecs_schemas lua lua_dlc; do
            [ -e "workshop_data/$c" ] || missing="$missing $c"
          done
          if [ -n "$missing" ]; then
            echo "::error::workshop_data is missing:$missing"
            exit 1
          fi
          echo "bundle contents:"; du -sh workshop_data/* | sed 's/^/  /'
          zip -r dist/mercs2-workshop-data.zip workshop_data > /dev/null
          echo "zip: $(du -h dist/mercs2-workshop-data.zip | cut -f1), $(unzip -l dist/mercs2-workshop-data.zip | tail -1)"

      # The mesh/texture-prep Python scripts are the community's front-end to the authoring tools
      # (FBX/glTF/PNG -> the blobs model_forge/smuggler consume). They are OS-independent, so bundle
      # them ONCE — from the x86_64-linux job only — rather than 4x per platform. Shipped alongside
      # the binaries so a modder doesn't have to hunt for them; see scripts/mesh-pipeline/README.md.
      - name: Bundle mesh-pipeline scripts (once)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          if [ ! -d scripts/mesh-pipeline ]; then
            echo "::error::scripts/mesh-pipeline missing — cannot bundle the pipeline scripts"; exit 1
          fi
          ( cd scripts && zip -r "../dist/mercs2-mesh-pipeline-scripts.zip" mesh-pipeline )
          echo "bundled:"; unzip -l dist/mercs2-mesh-pipeline-scripts.zip | sed 's/^/  /'

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          # Second glob matches only in the one job that built the scripts zip; a no-match is harmless.
          files: |
            dist/*${{ matrix.suffix }}
            dist/mercs2-workshop-data.zip
            dist/mercs2-mesh-pipeline-scripts.zip
