name: CI

# Pull requests only, per the repo's CI contract. Pushes to main are not gated here
# (the Release workflow handles tags); add a `push:` block if that changes.
on:
  pull_request:
  push:
  workflow_dispatch:

# One in-flight run per PR branch; a new push cancels the previous run's spend.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin to the toolchain the repo declares in .tool-versions, so CI exercises the
      # same compiler developers use rather than whatever "stable" happens to be.
      - uses: dtolnay/rust-toolchain@1.94.1

      # mercs2_engine links two C system libraries on Linux: gilrs -> libudev-sys
      # (gamepad hotplug via evdev) and cpal -> alsa-sys (audio output). The workspace
      # test build compiles the engine, so both are required — the same packages the
      # Release workflow installs for its 64-bit Linux rows.
      - name: Install engine system libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev libasound2-dev

      # mercs2_formats' be_to_le converter decodes Xbox XMA/XMA2 and PS3 MP3 sound with
      # ffmpeg (be_to_le/audio.rs) and round-trips console Lua bytecode with Java + unluac
      # (be_to_le/lua.rs). Its tests resolve ffmpeg on PATH and unluac at
      # tools/external/unluac/unluac.jar; Java is on the runner image.
      - name: Install ffmpeg
        run: |
          set -euo pipefail
          sudo apt-get install -y ffmpeg
          ffmpeg -hide_banner -decoders > "$RUNNER_TEMP/ffmpeg-decoders.txt"
          for d in xma1 xma2 mp3; do
            grep -E " $d " "$RUNNER_TEMP/ffmpeg-decoders.txt" || { echo "::error::ffmpeg has no $d decoder"; exit 1; }
          done

      - name: Download unluac (pinned)
        env:
          UNLUAC_URL: https://sourceforge.net/projects/unluac/files/Unstable/unluac_2025_12_23.jar/download
          UNLUAC_SHA256: 98be0fa84ac73ca66dce2842a2e4512226f4c611b6500dc96415571fc5538fcc
        run: |
          set -euo pipefail
          mkdir -p tools/external/unluac
          curl -fsSL -o tools/external/unluac/unluac.jar "$UNLUAC_URL"
          echo "$UNLUAC_SHA256  tools/external/unluac/unluac.jar" | sha256sum -c -
          java -jar tools/external/unluac/unluac.jar --help

      # Cache the registry, git deps and target dir keyed on the lockfile + toolchain.
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # One pass over the whole workspace. nextest runs every crate's tests as parallel
      # processes and (via the `ci` profile's fail-fast = false) does not stop at the
      # first failure, so all 40 crates are exercised in a single run. Results are
      # written to target/nextest/ci/junit.xml for the per-crate rollup below.
      #
      # Tests that read the retail vz.wad are not built here: that asset cannot be
      # committed, so they sit behind each crate's `retail` cargo feature, which this
      # run does not enable. They run locally with `cargo xtask retail-test`, against
      # the vz.wad named by the git-ignored .mercs2-local.toml, and fail when it is
      # missing. See README.md, "Game-gated tests".
      - name: Run workspace tests (nextest)
        run: cargo nextest run --workspace --profile ci

      # nextest does not run doctests. Run them separately so the crates carrying
      # fenced doc examples are exercised too; cargo attributes each as `Doc-tests <crate>`.
      # `always()` so a nextest failure doesn't skip doctest coverage.
      - name: Run doctests
        if: always()
        run: cargo test --workspace --doc

      # Roll the JUnit report up into a per-crate Passed/Failed/Skipped table in the
      # PR's checks summary, so a failure is attributable to a specific crate at a
      # glance. `always()` so the table is produced even when tests failed.
      - name: Per-crate summary
        if: always()
        run: python3 scripts/ci/nextest_summary.py target/nextest/ci/junit.xml >> "$GITHUB_STEP_SUMMARY"
