[workspace]
members = ["crates/wad_simulator", "crates/mercs2_formats", "crates/mercs2_luac", "crates/mercs2_mesh", "crates/ucfx_byteswap", "crates/dlc_port", "crates/loadprobe", "crates/mercs2_smuggler", "crates/havok_extract", "crates/destruction_extract", "crates/wad_builder", "crates/securom_unwrap", "crates/mercs2_core", "crates/mercs2_engine", "crates/mercs2_probe", "crates/mercs2_game", "crates/mercs2_script", "crates/anim_patch", "crates/mercs2_workshop", "crates/mercs2_reassemble", "crates/mercs2_physics", "crates/mercs2_anim", "crates/mercs2_vehicle", "crates/mercs2_combat", "crates/mercs2_ai", "crates/mercs2_faction", "crates/mercs2_audio", "crates/mercs2_ui", "crates/mercs2_net", "crates/mercs2_player", "crates/mercs2_population", "crates/mercs2_water", "crates/mercs2_decal", "crates/mercs2_jobs", "crates/mercs2_poc", "crates/mercs2_quartermaster", "crates/mercs2_destruction", "crates/mercs2_bridge", "crates/densify", "crates/ps3_dlc_crypt"]
resolver = "2"

# Shared package metadata inherited by every publishable crate (`license.workspace = true`,
# `repository.workspace = true`). Single source of truth — do not re-declare these per crate.
[workspace.package]
license = "MIT"
repository = "https://github.com/Mercenaries-Fan-Build/notes-on-the-released-game"

# Internal crate versions for publishing. Each publishable member references its intra-workspace
# deps as `<name> = { workspace = true }`; the version here is what crates.io resolves against.
# Bump sized by commit count since the crate's last release: <=2 patch, <20 minor, >=20 major.
# NOTE: mercs2_formats crossed to 3.0.0, so every dependent's `workspace = true` requirement moved
# with it — a `^2.1` consumer (e.g. mercs2-modkit) will NOT pick 3.0.0 up until it is edited too.
[workspace.dependencies]
mercs2_formats = { path = "crates/mercs2_formats", version = "3.5.1" }
mercs2_luac = { path = "crates/mercs2_luac", version = "1.1.1" }
mercs2_mesh = { path = "crates/mercs2_mesh", version = "1.0.1" }
ucfx_byteswap = { path = "crates/ucfx_byteswap", version = "2.1.2" }
mercs2_core = { path = "crates/mercs2_core", version = "1.0.3" }
mercs2_audio = { path = "crates/mercs2_audio", version = "1.2.2" }
mercs2_script = { path = "crates/mercs2_script", version = "2.0.1" }
mercs2_physics = { path = "crates/mercs2_physics", version = "1.1.0" }
mercs2_vehicle = { path = "crates/mercs2_vehicle", version = "1.1.1" }
mercs2_destruction = { path = "crates/mercs2_destruction", version = "1.1.0" }
mercs2_ai = { path = "crates/mercs2_ai", version = "1.0.2" }
mercs2_anim = { path = "crates/mercs2_anim", version = "1.1.1" }
mercs2_water = { path = "crates/mercs2_water", version = "1.2.1" }
mercs2_decal = { path = "crates/mercs2_decal", version = "1.0.2" }
mercs2_population = { path = "crates/mercs2_population", version = "1.0.2" }
mercs2_combat = { path = "crates/mercs2_combat", version = "1.2.1" }
mercs2_faction = { path = "crates/mercs2_faction", version = "1.0.2" }
mercs2_ui = { path = "crates/mercs2_ui", version = "1.1.1" }
mercs2_player = { path = "crates/mercs2_player", version = "1.1.1" }
mercs2_engine = { path = "crates/mercs2_engine", version = "1.4.1" }
# The Shipment format, linter and builder. Registered here because neither the Workshop nor Modkit
# owns the format — this crate does, and both are clients. Without an entry they cannot write
# `mercs2_quartermaster = { workspace = true }` at all.
mercs2_quartermaster = { path = "crates/mercs2_quartermaster", version = "2.3.0" }
mercs2_bridge = { path = "crates/mercs2_bridge", version = "0.1.1" }
# The consumption simulator, as a LIBRARY. Registered because its engine-accurate predicates are the
# proven implementations of several linter rules — `texture::texture_buffer_too_small` in particular,
# whose two false-positive gates were verified against retail (9,562 legitimately short streamed
# bodies). Reimplementing that predicate in the linter is how the two copies drift; depending on it
# is how they cannot. Safe to link anywhere: this crate pulls no Lua runtime, so it does not collide
# with `mercs2_luac` (see the warning on `mercs2_quartermaster`'s dependency list).
wad_simulator = { path = "crates/wad_simulator", version = "2.2.5" }

# The load path is CPU-bound `sges`/zlib block decompression + mesh assembly. In a plain `dev` build
# those run UNOPTIMIZED, making the PMC-interior boot ~134s (vs ~15s optimized) — a ~9x tax purely from
# debug codegen. These per-package overrides optimize the hot asset/decompress/mesh crates + all
# dependencies at -O3 while leaving the game-logic crates (mercs2_game/engine glue) at debug for fast
# iteration + symbols. `cargo run` (dev) now loads at near-release speed without a full release build.
[profile.dev.package."*"]
opt-level = 3          # all third-party deps (miniz/zlib inflate, glam, wgpu, etc.)

[profile.dev.package.mercs2_formats]
opt-level = 3          # sges decompress + terrain/texture/mesh container parsing (the load hot path)

[profile.dev.package.mercs2_core]
opt-level = 3          # glam-heavy math (pose/skin palettes, transforms)

[profile.dev.package.mercs2_engine]
opt-level = 3          # wad extract + mesh build + pose skinning driven from the loader
